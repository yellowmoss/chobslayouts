<header style="margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #eee;">
  <nav style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <a href="{{ site.Home.RelPermalink }}" style="font-weight: bold; text-decoration: none; font-size: 1.2rem; color: inherit;">
        {{ site.Title }}
      </a>
    </div>

    <ul style="display: flex; list-style: none; gap: 1.5rem; margin: 0; padding: 0;">
      <li>
        <a href="{{ site.Home.RelPermalink }}" style="text-decoration: none;">Home</a>
      </li>
      {{ range site.Sections.ByWeight }}
        <li>
          <a href="{{ .RelPermalink }}" style="text-decoration: none;">{{ .LinkTitle }}</a>
        </li>
      {{ end }}
    </ul>
  </nav>
</header>
