
{{ define "main" }}

  <div class="text-flow">

  <h1>{{ .Title }}</h1>

  {{- with .Content -}}
    <div class="section-intro">
      {{ . }}
    </div>
  {{- end -}}

  {{- $terms := .Data.Terms.ByCount -}}
  {{- if $terms -}}
    <ul class="tag-list">
      {{- range first 50 $terms -}}
        <li>
          <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
        </li>
      {{- end -}}
    </ul>
  {{- else -}}
    <p>No tags found.</p>
  {{- end -}}

  </div>

{{ end }}
