<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- CRITICAL: Tells mobile browsers to scale text and layout properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }}</title>
    
    <!-- Gallery CSS: 2-column, left-aligned, capped at 700px -->




<style>
  /* Base fluid typography setup - bumped up for better mobile readability */
  :root {
    font-size: clamp(1.125rem, 1rem + 0.75vw, 1.25rem);
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    color: #222;
    padding: clamp(1rem, 3vw, 2rem); 
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Fluid headings */
  h1 {
    font-size: clamp(2rem, 1.75rem + 2vw, 2.8rem);
  }

  h2 {
    font-size: clamp(1.5rem, 1.35rem + 1.2vw, 2.2rem);
  }

  /* --- Responsive Gallery Grid --- */
  .gallery-grid {
    display: grid !important;
    grid-template-columns: 1fr !important; /* 1 column on mobile */
    gap: 16px !important;
    width: 100% !important;
    max-width: 1400px !important;
    margin: 1.5rem 0 !important;
    padding: 0 !important;
  }

  /* Expand to 2 columns on tablets/desktops */
  @media (min-width: 768px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 20px !important;
    }
  }

  .gallery-grid a {
    display: block !important;
    width: 100% !important;
    text-align: left !important;
  }

  .gallery-grid img {
    width: 100% !important;
    max-width: 700px !important;
    height: auto !important;
    display: block !important;
    margin: 0 auto !important;
    border-radius: 6px !important;
  }

  /* --- Modern Responsive Video Container --- */
  .video-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 1.5rem 0;
  }

  .video-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 6px;
  }
</style>




</head>
<body>

    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

</body>
</html>
