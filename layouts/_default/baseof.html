<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- CRITICAL: Tells mobile browsers to scale text and layout properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }}</title>
    
    <!-- Gallery CSS: 2-column, left-aligned, capped at 700px -->


<style>
  /* Base fluid typography setup */
  :root {
    /* Scales smoothly: minimum 1rem on mobile, growing with viewport width, capping at 1.125rem on desktop */
    font-size: clamp(1rem, 0.9rem + 0.5vw, 1.125rem);
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    color: #222;
    padding: clamp(0.75rem, 2vw, 2rem); /* Fluid padding based on screen size */
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Fluid headings that scale proportionally between mobile and desktop */
  h1 {
    font-size: clamp(1.75rem, 1.5rem + 1.5vw, 2.5rem);
  }

  h2 {
    font-size: clamp(1.35rem, 1.2rem + 1vw, 2rem);
  }

  /* --- Responsive Gallery Grid --- */
  .gallery-grid {
    display: grid !important;
    /* Mobile-first: single column by default */
    grid-template-columns: 1fr !important; 
    gap: 12px !important;
    width: 100% !important;
    max-width: 1400px !important;
    margin: 1.5rem 0 !important;
    padding: 0 !important;
  }

  /* Expand to 2 columns on tablets, laptops (your 1920x1080), and wide phones */
  @media (min-width: 768px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 16px !important;
    }
  }

  .gallery-grid a {
    display: block !important;
    width: 100% !important;
    text-align: left !important;
  }

  .gallery-grid img {
    width: 100% !important;
    max-width: 700px !important;
    height: auto !important;
    display: block !important;
    margin: 0 !important;
    border-radius: 4px !important;
  }

  /* --- Modern Responsive Video Container --- */
  .video-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 1.5rem 0;
  }

  .video-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 4px;
  }
</style>



</head>
<body>

    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

</body>
</html>
