<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ .Title }}</title>

  <style>
    /* 1. Reset */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000; /* Letterbox / pillarbox background */
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 2. Full-Screen Centering Shell */
    .viewport-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3. The Industry-Standard Responsive Video Box 
       Uses width: 100% and padding-bottom: 56.25% (which is 9/16). 
       This forces the container to maintain a perfect 16:9 box that fills 
       the available width on mobile phones instantly. */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* On wide desktop/laptop screens, restrict the width 
       so it doesn't stretch past the screen height */
    @media (min-aspect-ratio: 16/9) {
      .video-wrapper {
        width: auto;
        height: 100vh;
      }
    }

    /* On tall smartphone screens, restrict the height 
       so it doesn't stretch past the screen width */
    @media (max-aspect-ratio: 16/9) {
      .video-wrapper {
        width: 100vw;
        height: auto;
      }
    }

    /* 4. The Video / Iframe fills the container completely */
    .video-wrapper iframe,
    .video-wrapper video,
    .video-wrapper .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="viewport-stage">

    {{ partial "header.html" . }}

    <div class="video-wrapper">
      {{ block "main" . }}{{ end }}
    </div>

    {{ partial "footer.html" . }}


  </div>

</body>
</html>
