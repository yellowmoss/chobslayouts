<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ .Title }}</title>

  <style>
    /* 1. Reset & Full-Screen Viewport Lock */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* 2. Universal Stage */
    .viewport-stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* 3. LANDSCAPE VIDEO WRAPPER (16:9) */
    .video-wrapper.landscape {
      position: relative;
      width: min(100vw, 100vh * (16 / 9));
      height: min(100vh, 100vw / (16 / 9));
      aspect-ratio: 16 / 9;
    }

    /* 4. PORTRAIT VIDEO WRAPPER (9:16) */
    .video-wrapper.portrait {
      position: relative;
      width: min(100vw, 100vh * (9 / 16));
      height: min(100vh, 100vw / (9 / 16));
      aspect-ratio: 9 / 16;
    }

    /* 5. Universal Iframe/Video Fill */
    .video-wrapper iframe,
    .video-wrapper video,
    .video-wrapper .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      border-radius: 12px;
    }
  </style>
</head>
<body>
    {{ partial "header.html" . }}

  <div class="viewport-stage">
    {{ block "main" . }}{{ end }}
  </div>
    {{ partial "footer.html" . }}

</body>
</html>
