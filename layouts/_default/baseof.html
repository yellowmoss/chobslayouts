<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ .Title }}</title>

  <style>
    /* 1. Reset: Lock the page to the exact viewport bounds, zero scroll */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000; /* Letterbox / pillarbox background */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. The Scaling Container 
       This strictly enforces our 16:9 bounds relative to the viewport dimensions */
    .video-viewport-scaler {
      position: relative;
      /* The magic CSS math: automatically chooses width/height based on viewport orientation */
      width: min(100vw, 100vh * (16 / 9));
      height: min(100vh, 100vw / (16 / 9));
      aspect-ratio: 16 / 9;
    }

    /* 3. The Video / Iframe fills the scaler container perfectly */
    .video-viewport-scaler iframe,
    .video-viewport-scaler video,
    .video-viewport-scaler .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
    }
  </style>
</head>
<body>
    {{ partial "header.html" . }}

  <!-- Hugo injects the video content here, perfectly scaled to the viewport -->
  <div class="video-viewport-scaler">
    {{ block "main" . }}{{ end }}
  </div>

    {{ partial "footer.html" . }}


</body>
</html>
