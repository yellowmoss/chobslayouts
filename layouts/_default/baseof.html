<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ .Title }}</title>

  <style>
    /* 1. Modern Box-Sizing & Predictable Root Scale */
    html {
      font-size: 100%; /* 16px base browser default for accessibility */
      -webkit-text-size-adjust: 100%;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.6rem; 
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Main content wrapper to handle wide desktops gracefully */
    .site-container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 2rem 1.6rem;
      flex: 1;
    }

    h1 {
      font-size: 2.4rem;
      line-height: 1.2;
      margin: 0 0 1.6rem 0;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 2.0rem;
      line-height: 1.3;
      margin: 2.8rem 0 1.2rem 0;
    }

    /* 2. ROBUST RESPONSIVE VIDEO EMBEDS 
       Using an outer wrapper guarantees the iframe doesn't collapse vertically in Safari/iOS */
    .video-container,
    iframe[src*="player.vimeo.com"] {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
      border-radius: 12px;
      overflow: hidden;
      margin: 2.4rem 0;
      background: #000; /* Fallback background while video loads */
    }

    /* Target raw iframe specifically if it's pasted directly */
    iframe[src*="player.vimeo.com"] {
      display: block;
    }

    /* 3. GALLERY GRID: 1 column on phone, 2 columns on desktop */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.4rem;
      width: 100%;
      margin: 2.4rem 0;
    }

    .gallery-grid a {
      display: block;
      width: 100%;
      text-align: left;
      text-decoration: none;
    }

    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      object-fit: cover;
    }

    /* 4. DESKTOP / LAPTOP BREAKPOINT */
    @media (min-width: 768px) {
      .site-container {
        padding: 4rem 3.2rem;
      }

      h1 {
        font-size: 3.6rem;
      }

      h2 {
        font-size: 2.6rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 3.2rem;
      }
    }
  </style>
</head>

<body>

    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

</body>
</html>
