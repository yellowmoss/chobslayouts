<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ .Title }}</title>

  <style>
    /* 1. Root Scale: 1rem = 10px predictable baseline */
    html {
      font-size: 10px;
      -webkit-text-size-adjust: 100%;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.6rem; /* 16px readable text on phone & laptop */
      line-height: 1.6;
      color: #0f0f0f;
      margin: 0 auto;
      padding: 1.6rem;
      max-width: 1400px;
    }

    h1 {
      font-size: 2.4rem;
      line-height: 1.25;
      margin: 0 0 1.6rem 0;
    }

    h2 {
      font-size: 2.0rem;
      line-height: 1.3;
      margin: 2.4rem 0 1.2rem 0;
    }

    /* 2. RAW VIMEO EMBEDS: Targets pasted <iframe> tags directly without needing wrapper divs */
    iframe[src*="player.vimeo.com"],
    .video-container iframe {
      display: block;
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
      margin: 2.0rem 0;
    }

    /* Optional wrapper support if you still use .video-container anywhere */
    .video-container {
      width: 100%;
      margin: 2.0rem 0;
    }

    /* 3. GALLERY GRID: 1 column on phone, 2 columns on laptop */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.0rem;
      width: 100%;
      max-width: 1400px;
      margin: 2.0rem 0;
      padding: 0;
    }

    .gallery-grid a {
      display: block;
      width: 100%;
      text-align: left;
    }

    .gallery-grid img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0;
      border-radius: 12px;
    }

    /* 4. DESKTOP / LAPTOP BREAKPOINT (1920x1080) */
    @media (min-width: 768px) {
      body {
        padding: 3.2rem;
        font-size: 1.7rem;
      }

      h1 {
        font-size: 3.2rem;
      }

      h2 {
        font-size: 2.4rem;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 2.4rem;
      }

      .gallery-grid img {
        max-width: 700px;
      }
    }
  </style>
</head>
<body>

    {{ partial "header.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

</body>
</html>
