{{ define "main" }}
  <div class="text-flow">
  <h1>{{ .Title }}</h1>
  <h1>Tag listing</h1>
  {{- with .Content -}}
    <div class="section-intro">
      {{ . }}
    </div>
  {{- end -}}
  {{- $terms := .Data.Terms.Alphabetical -}}
  {{- if $terms -}}
    <div class="tag-list">
      {{- range first 50 $terms -}}
          <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
          <span class="tag-count">({{ len .Pages }})</span>
      {{- end -}}
    </div>
  {{- else -}}
    <p>No tags found.</p>
  {{- end -}}
  </div>
{{ end }}
